<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#0b1020" />
    <meta name="description"
        content="Play XO Nova, a neon Tic-Tac-Toe game. Challenge a friend or play against the computer." />

    <title>XO Nova — Tic-Tac-Toe</title>

    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <main class="app">
        <header class="topbar">
            <a class="brand" href="./" aria-label="XO Nova home">
                <span class="brand-icon">X<span>O</span></span>
                <span>XO <strong>NOVA</strong></span>
            </a>

            <button id="install-button" class="install-button" hidden>
                Install App
            </button>
        </header>

        <section class="hero">
            <p class="eyebrow">THE CLASSIC, REIMAGINED</p>
            <h1>XO <span>Nova</span></h1>
            <p class="subtitle">Make every move count.</p>
        </section>

        <section class="game-panel" aria-label="Tic-Tac-Toe game">
            <div class="mode-row">
                <label for="game-mode">Game mode</label>
                <select id="game-mode">
                    <option value="friend">Play with a friend</option>
                    <option value="computer">Play against computer</option>
                </select>
            </div>

            <div class="scoreboard">
                <div class="score-card score-x">
                    <span class="score-symbol">X</span>
                    <span class="score-label">PLAYER X</span>
                    <strong id="score-x">0</strong>
                </div>

                <div class="score-card score-draw">
                    <span class="score-symbol">—</span>
                    <span class="score-label">DRAWS</span>
                    <strong id="score-draw">0</strong>
                </div>

                <div class="score-card score-o">
                    <span class="score-symbol">O</span>
                    <span class="score-label" id="player-o-label">PLAYER O</span>
                    <strong id="score-o">0</strong>
                </div>
            </div>

            <div class="turn-indicator" id="turn-indicator" role="status" aria-live="polite">
                Player X's turn
            </div>

            <div class="board" id="board" aria-label="Game board">
                <button class="cell" data-index="0" aria-label="Square 1"></button>
                <button class="cell" data-index="1" aria-label="Square 2"></button>
                <button class="cell" data-index="2" aria-label="Square 3"></button>
                <button class="cell" data-index="3" aria-label="Square 4"></button>
                <button class="cell" data-index="4" aria-label="Square 5"></button>
                <button class="cell" data-index="5" aria-label="Square 6"></button>
                <button class="cell" data-index="6" aria-label="Square 7"></button>
                <button class="cell" data-index="7" aria-label="Square 8"></button>
                <button class="cell" data-index="8" aria-label="Square 9"></button>
            </div>

            <p id="game-message" class="game-message" aria-live="polite">
                Ready to play? Make your first move!
            </p>

            <div class="actions">
                <button id="new-round-button" class="primary-button">
                    New Round
                </button>
                <button id="reset-score-button" class="secondary-button">
                    Reset Scores
                </button>
            </div>
        </section>

        <footer class="site-footer">
            <p class="footer-tagline">A little strategy, a little fun.</p>
            <p>Designed &amp; Developed by <span class="developer-name">Ayesha Nisar</span></p>
            <p class="copyright">&copy; 2026 XO Nova</p>
        </footer>

    </main>

    <script src="script.js" defer></script>
</body>

</html>
